server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `types { }` 블록을 쓰면 안 된다. nginx 는 그것을 **상속된 MIME 맵 전체의
    # 대체**로 다루므로, webmanifest 하나만 적으면 html·css·js 가 전부
    # default_type(application/octet-stream) 으로 떨어진다. nosniff 와 겹치면
    # 브라우저가 렌더를 거부하고 파일을 내려받는다 — 화면이 통째로 안 뜬다.
    #
    # 확장자 하나만 필요하므로 그 위치에서 default_type 으로 지정한다.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               application/manifest+json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Browser clients use a same-origin MCP route because the upstream does not
    # answer CORS preflights. Keep the public-data service behind this narrow path.
    location = /api/mcp {
        proxy_pass https://datainfra.salgil.gyeongbuk.kr/mcp/;
        proxy_ssl_server_name on;
        proxy_set_header Host datainfra.salgil.gyeongbuk.kr;
        proxy_set_header Accept "application/json, text/event-stream";
        proxy_connect_timeout 10s;
        proxy_read_timeout 35s;
    }

    # Vite emits content-hashed filenames here, so they are safe to pin forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA entrypoints must always be revalidated or clients get stuck on a stale build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
