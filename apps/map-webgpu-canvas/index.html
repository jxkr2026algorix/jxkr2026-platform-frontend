<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SALGIL disaster simulation map</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gpu-canvas" aria-label="3D disaster simulation map"></canvas>
      <div id="fallback" hidden>
        <h1>Unable to display the 3D map</h1>
        <p>
          This browser does not support WebGPU. Reopen the map in the latest
          version of Chrome, Edge, or Safari.
        </p>
      </div>
      <div id="map-annotations" aria-hidden="true"></div>
      <aside id="panel" hidden aria-label="Simulation controls"></aside>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
